# Project-wide Gradle settings.
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true

# AndroidX / Kotlin
android.useAndroidX=true
kotlin.code.style=official

# FRM-81: KSP (needed for Room's annotation processing) does not yet support AGP's
# built-in Kotlin support (AGP 9+'s default) - see https://kotl.in/gradle/agp-built-in-kotlin.
# Disabling it and applying the org.jetbrains.kotlin.android plugin explicitly
# (see build.gradle.kts / app/build.gradle.kts) restores normal KSP support.
android.builtInKotlin=false
# AGP 9's new DSL (the default) is incompatible with the classic
# org.jetbrains.kotlin.android plugin's internals (BaseExtension cast failure) -
# see https://kotl.in/gradle/agp-new-dsl. Falling back to the legacy DSL is the
# officially-documented bridge until KSP supports AGP's built-in Kotlin directly.
android.newDsl=false

# F-Droid compatibility: use the new (v2) APK packaging structure and avoid
# anything that pulls in Google Play Services / Firebase / proprietary SDKs.
android.useNewApkStructure=true

# Non-transitive R classes (smaller, faster builds; recommended default)
android.nonTransitiveRClass=true
