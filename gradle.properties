# Project-wide Gradle settings.
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true

# AndroidX / Kotlin
android.useAndroidX=true
kotlin.code.style=official

# F-Droid compatibility: use the new (v2) APK packaging structure and avoid
# anything that pulls in Google Play Services / Firebase / proprietary SDKs.
android.useNewApkStructure=true

# Non-transitive R classes (smaller, faster builds; recommended default)
android.nonTransitiveRClass=true
