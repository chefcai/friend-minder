name: release

# Builds a sideloadable APK and attaches it to a GitHub Release.
#
# Triggers:
#   - push of a tag `v*` (e.g. v0.1.0)        -> release named after the tag
#   - manual "Run workflow"                     -> pre-release tagged build-<run number>
#
# Deliberately separate from ci.yml: a release is never cut automatically on
# every merge to main, only when someone tags a version or runs this by hand.
#
# Signing: if the repo secrets RELEASE_KEYSTORE_BASE64 / RELEASE_KEYSTORE_PASSWORD /
# RELEASE_KEY_ALIAS / RELEASE_KEY_PASSWORD are set, a signed *release* APK is built
# and published. Otherwise the debug-signed APK is published (installable on any
# phone that allows sideloading; that is the PRD §7 MVP deliverable - no signing
# keystore has been generated for this repo yet, see FRM-16).

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v4
        with:
          # The action's default package list includes the long-deprecated
          # 'tools' package, which newer cmdline-tools no longer offer -
          # sdkmanager then exits 1 and the job fails before building.
          packages: platform-tools

      - name: Decide variant
        id: variant
        env:
          HAS_KEYSTORE: ${{ secrets.RELEASE_KEYSTORE_BASE64 != '' }}
        run: |
          if [ "$HAS_KEYSTORE" = "true" ]; then
            echo "name=release" >> "$GITHUB_OUTPUT"
          else
            echo "name=debug" >> "$GITHUB_OUTPUT"
            echo "No signing secrets configured - publishing the debug-signed APK."
          fi

      # chefcai/friend-minder#37: derive versionCode/versionName from the pushed tag so a
      # tagged release is never out of sync with what app/build.gradle.kts happens to have
      # committed - no manual "bump the version" step to forget before cutting a release.
      # Only tag pushes get this treatment; a workflow_dispatch dry run (no tag) keeps
      # whatever defaults are committed, since there's no tag to derive from.
      - name: Derive version from tag
        id: version
        if: github.ref_type == 'tag'
        run: |
          TAG="${{ github.ref_name }}"
          VERSION_NAME="${TAG#v}"
          IFS='.' read -r MAJOR MINOR PATCH <<< "$VERSION_NAME"
          if ! [[ "$MAJOR" =~ ^[0-9]+$ && "$MINOR" =~ ^[0-9]+$ && "$PATCH" =~ ^[0-9]+$ ]]; then
            echo "Tag '$TAG' isn't a plain vMAJOR.MINOR.PATCH - skipping version override, keeping committed defaults." >&2
            exit 0
          fi
          VERSION_CODE=$((MAJOR * 10000 + MINOR * 100 + PATCH))
          echo "name=$VERSION_NAME" >> "$GITHUB_OUTPUT"
          echo "code=$VERSION_CODE" >> "$GITHUB_OUTPUT"
          echo "Derived versionName=$VERSION_NAME versionCode=$VERSION_CODE from tag $TAG"

      - name: Restore keystore
        if: steps.variant.outputs.name == 'release'
        run: echo "${{ secrets.RELEASE_KEYSTORE_BASE64 }}" | base64 -d > "$RUNNER_TEMP/release.jks"

      - name: Build
        env:
          RELEASE_KEYSTORE_FILE: ${{ steps.variant.outputs.name == 'release' && format('{0}/release.jks', runner.temp) || '' }}
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          VERSION_PROPS=()
          if [ -n "${{ steps.version.outputs.name }}" ]; then
            VERSION_PROPS=(-PappVersionName="${{ steps.version.outputs.name }}" -PappVersionCode="${{ steps.version.outputs.code }}")
          fi
          ./gradlew testDebugUnitTest "${VERSION_PROPS[@]}"
          if [ "${{ steps.variant.outputs.name }}" = "release" ]; then
            ./gradlew assembleRelease "${VERSION_PROPS[@]}"
          else
            ./gradlew assembleDebug "${VERSION_PROPS[@]}"
          fi

      - name: Name the APK
        id: apk
        run: |
          V="${{ steps.variant.outputs.name }}"
          SRC="app/build/outputs/apk/$V/app-$V.apk"
          if [ "${{ github.ref_type }}" = "tag" ]; then TAG="${{ github.ref_name }}"; else TAG="build-${{ github.run_number }}"; fi
          OUT="friend-minder-${TAG}-${V}.apk"
          cp "$SRC" "$OUT"
          echo "file=$OUT" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          sha256sum "$OUT" | tee "$OUT.sha256"

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.apk.outputs.file }}
          path: |
            ${{ steps.apk.outputs.file }}
            ${{ steps.apk.outputs.file }}.sha256
          if-no-files-found: error

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.apk.outputs.tag }}
          name: Friend-minder ${{ steps.apk.outputs.tag }}
          prerelease: ${{ github.ref_type != 'tag' }}
          generate_release_notes: true
          files: |
            ${{ steps.apk.outputs.file }}
            ${{ steps.apk.outputs.file }}.sha256
