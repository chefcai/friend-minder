name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  baseline:
    # contents/pull-requests: write let the shared workflow list gitleaks
    # findings against the diff and comment on the PR - it cannot grant
    # itself permissions, the caller has to.
    permissions:
      contents: read
      pull-requests: write
    uses: chefcai/ci-templates/.github/workflows/baseline.yml@main
    with:
      gitleaks-blocking: true
      trivy-fs-blocking: true

  kotlin:
    # checks/pull-requests write let the shared workflow publish JUnit
    # results as a check run, inline annotations and a PR comment - same
    # reason as above.
    permissions:
      contents: read
      checks: write
      pull-requests: write
    uses: chefcai/ci-templates/.github/workflows/kotlin.yml@main
    with:
      is-android: true
      build-cmd: "./gradlew assembleDebug"
      test-cmd: "./gradlew test lintDebug"
      # Flipped to blocking (FRM-16): the 2 pre-existing findings that kept
      # this report-only (SwallowedException in SmsLaunchActivity, issue #4;
      # LoopWithTooManyJumpStatements in ContactsLoader, issue #5) were both
      # fixed and merged in #20.
      detekt-blocking: true
